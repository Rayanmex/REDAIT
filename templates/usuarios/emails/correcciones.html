<!DOCTYPE html>
<html>
<body style="font-family: Arial, sans-serif; color:#333;">
  <div style="max-width:600px;margin:auto;border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;">
    <div style="background:#991547;color:#fff;padding:20px;text-align:center;">
      <h2 style="margin:0;">Correcciones requeridas</h2>
    </div>
    <div style="padding:24px;">
      <p>Estimado(a) <strong>{{ solicitud.ciudadano.nombre_completo }}</strong>,</p>
      <p>Tu solicitud con folio <strong>{{ solicitud.folio }}</strong> requiere las siguientes correcciones:</p>
      <blockquote style="background:#fff7ed;border-left:4px solid #f59e0b;padding:12px;margin:16px 0;">
        {{ comentario }}
      </blockquote>
      <p>Ingresa a tu panel para corregir y reenviar tu solicitud:</p>
      <p style="text-align:center;">
        <a href="{{ request.scheme }}://{{ request.get_host }}/usuarios/panel/"
           style="background:#991547;color:#fff;padding:12px 24px;text-decoration:none;border-radius:6px;">
          Ir a mi panel
        </a>
      </p>
    </div>
    <div style="background:#f9fafb;padding:12px;text-align:center;font-size:12px;color:#6b7280;">
      REDAIT Tabasco · No responda a este correo
    </div>
  </div>
</body>
</html>
