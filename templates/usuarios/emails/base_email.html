<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>REDAIT</title>
</head>
<body style="margin:0; padding:0; background:#f8fafc; font-family: Arial, sans-serif; color:#1f2937;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc; padding:30px 15px;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:16px; overflow:hidden; box-shadow:0 4px 20px rgba(0,0,0,0.06);">
          <tr>
            <td style="background: linear-gradient(135deg,#991547 0%,#4a0a22 100%); padding:25px 30px; color:#fff;">
              <h1 style="margin:0; font-size:22px; font-weight:800;">REDAIT Tabasco</h1>
              <p style="margin:5px 0 0; font-size:13px; opacity:0.85;">Registro Estatal de Agentes Inmobiliarios</p>
            </td>
          </tr>
          <tr>
            <td style="padding:30px;">
              {% block contenido %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="background:#f8fafc; padding:20px 30px; text-align:center; font-size:12px; color:#6b7280; border-top:1px solid #f1f5f9;">
              <p style="margin:0 0 5px;">Este correo fue enviado automáticamente. Por favor no respondas.</p>
              <p style="margin:0;">&copy; 2026 Secretaría de Turismo de Tabasco</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
